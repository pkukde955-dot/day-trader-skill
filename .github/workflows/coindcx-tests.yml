name: CoinDCX and repository tests

on:
  pull_request:
    paths:
      - "trader-scanner/crypto/**"
      - "tests/**"
      - ".github/workflows/coindcx-tests.yml"
  push:
    branches:
      - "feat/coindcx-crypto-spot-handoff"

permissions:
  contents: read

jobs:
  coindcx-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run focused CoinDCX unit tests
        run: python -m unittest discover -s tests -p "test_coindcx.py" -v

  full-repository-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run complete repository test suite
        run: python -m unittest discover -s tests -v
