name: India F&O read-only tests

on:
  pull_request:
    paths:
      - "trader-scanner/india_fno/**"
      - "tests/test_india_fno_*.py"
      - "tests/test_india_fno_strategy.js"
      - ".github/workflows/india-fno-tests.yml"
  push:
    branches:
      - "fix/india-fno-data-validation-2026-10-29"
      - "fix/india-fno-probe-freshness-2026-10-29"
      - "feat/india-fno-cost-oos-validation-2026-10-29"
      - "feat/india-fno-csv-audit-2026-10-29"
    paths:
      - "trader-scanner/india_fno/**"
      - "tests/test_india_fno_*.py"
      - "tests/test_india_fno_strategy.js"
      - ".github/workflows/india-fno-tests.yml"

permissions:
  contents: read

jobs:
  india-fno-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run India F&O read-only tests
        run: |
          python -m unittest discover -s tests -p 'test_india_fno_*.py' -v
      - name: Run strategy and no-lookahead tests
        run: node --test tests/test_india_fno_strategy.js
