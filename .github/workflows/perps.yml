name: CoinDCX Perps Tests

on:
  push:
    branches:
      - feat/coindcx-usdt-perps-only

permissions:
  contents: read

jobs:
  perps-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run focused Perps tests
        run: |
          python -m unittest discover -s tests -p 'test_coindcx_perps.py' -v
          python -m unittest discover -s tests -p 'test_perps_paper.py' -v
          python -m unittest discover -s tests -p 'test_perps_strategy.py' -v
      - name: Run repository regression tests
        run: python -m unittest discover -s tests -v
